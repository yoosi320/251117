<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Naver Commerce Viewer{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    header { margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 13px; }
    th { background-color: #f2f2f2; }
    a.button, button {
      display: inline-block;
      padding: 6px 12px;
      margin: 4px 0;
      text-decoration: none;
      border-radius: 4px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: #fafafa;
    }
    .pagination a {
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Naver Commerce 상품 뷰어</h1>
    <nav>
      <a href="/" class="button">스토어 선택</a>
    </nav>
  </header>

  {% block content %}{% endblock %}
</body>
</html>
